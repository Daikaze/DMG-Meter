name: Publish Foundry Module

on:
  push:
    branches: [main]
    paths:
      - module.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out module
        uses: actions/checkout@v4

      - name: Build Foundry-installable ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("module.json"))["version"])')"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          python3 - <<'PY'
          import json, os, zipfile
          with open("module.json", encoding="utf-8") as f:
              version = json.load(f)["version"]
          files = [
              "module.json",
              "scripts/highest-dmg.js",
              "styles/highest-dmg.css",
              "templates/scoreboard.hbs",
              "languages/en.json",
              "README.md",
          ]
          for file in files:
              if not os.path.isfile(file):
                  raise FileNotFoundError(file)
          filename = f"dist/averis-highest-dmg-v{version}.zip"
          with zipfile.ZipFile(filename, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for file in files:
                  archive.write(file, file)
          print(filename)
          PY

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          ZIP="dist/averis-highest-dmg-v${VERSION}.zip"
          cat > /tmp/release-notes.md <<'NOTES'
          ## Averis Highest DMG

          - Highest single-hit damage leaderboard for Foundry V14 / D&D 5e.
          - GM can add, edit and delete records; players have a read-only view.
          - Open directly from the left-side Scene Controls trophy button.
          - Custom token art: browse files, use token art or character portrait, preview images before saving.
          - Existing records and their artwork remain saved in world settings.

          ### Install
          Use the stable manifest:
          `https://raw.githubusercontent.com/Daikaze/DMG-Meter/main/module.json`
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ZIP" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Averis Highest DMG ${TAG}" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi
